services:
  - type: web
    name: caretrack-mrms-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        value: https://caretrack-mrms.onrender.com

  - type: web
    name: caretrack-mrms
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://caretrack-mrms-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
